<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | LOL Dental</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

  <div class="admin-login-page">
    <div class="admin-login-bg">
      <div class="login-blob login-blob-1"></div>
      <div class="login-blob login-blob-2"></div>
    </div>

    <div class="admin-login-card">
      <div class="admin-login-brand">
        <div class="admin-brand-icon">🦷</div>
        <h1>LOL Dental</h1>
        <p>Admin Dashboard</p>
      </div>

      <div id="login-alert" class="alert"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" class="form-input" placeholder="admin@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="password-field">
            <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%; margin-top: 8px;">
          🔒 Login to Dashboard
        </button>
      </form>

      <div class="admin-login-footer">
        <a href="/" class="back-to-site">← Back to Website</a>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('lolDentalAdminToken');
    if (token) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!email || !password) {
        showLoginAlert('error', 'Please enter both email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('lolDentalAdminToken', data.token);
          window.location.href = '/admin/dashboard.html';
        } else {
          showLoginAlert('error', data.message || 'Login failed.');
          btn.disabled = false;
          btn.innerHTML = '🔒 Login to Dashboard';
        }
      } catch (err) {
        showLoginAlert('error', 'Network error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '🔒 Login to Dashboard';
      }
    });

    function showLoginAlert(type, msg) {
      const el = document.getElementById('login-alert');
      el.className = `alert alert-${type} show`;
      el.innerHTML = `<span class="alert-icon">${type === 'error' ? '❌' : '✅'}</span><span>${msg}</span>`;
    }

    // Password toggle
    document.getElementById('passwordToggle').addEventListener('click', () => {
      const input = document.getElementById('adminPassword');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
